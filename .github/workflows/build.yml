name: Build CP
on:
  push:
    branches-ignore: [jar]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: mvn -B -q package
      - name: Publish jar
        run: |
          JAR=$(ls target/*.jar | grep -v original | head -1)
          mkdir /tmp/out
          cp "$JAR" "/tmp/out/CP-${GITHUB_SHA}.jar"
          cd /tmp/out
          git init -q -b jar
          git config user.name cp-builder
          git config user.email cp-builder@users.noreply.github.com
          git add .
          git commit -qm "jar ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" jar
